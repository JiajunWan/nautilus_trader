[package]
name = "nautilus-alpaca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca US equities and options integration for NautilusTrader"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]
python = [
  "dep:nautilus-system",
  "dep:pyo3",
  "dep:pyo3-stub-gen",
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-system/python",
]
extension-module = ["python", "pyo3/extension-module"]
examples = ["nautilus-live/node", "nautilus-trading/examples"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, features = ["transport-sockudo"] }
nautilus-system = { workspace = true, optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bon = { workspace = true }
jiff = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
rmp-serde = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
uuid = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }
nautilus-trading = { workspace = true }
rstest = { workspace = true }

[[example]]
name = "alpaca-paper-smoke"
path = "examples/paper_smoke.rs"
required-features = ["examples"]

[[example]]
name = "alpaca-option-data"
path = "examples/option_data.rs"
required-features = ["examples"]
